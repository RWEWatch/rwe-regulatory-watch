# Monitored sources
# ------------------------------------------------------------------
# Fields:
#   id        unique identifier (used by the "already seen" memory)
#   name      display name
#   region    International | Europe | Americas | Asia-Pacific | Africa & Middle East | Publications
#   tier      1 = major agency (checked systematically), 2 = wider coverage / smaller agencies
#   type      rss | page | federal_register | pubmed | europepmc | arxiv | clinicaltrials | gnews
#   url       RSS/Atom feed or "news" page (rss, page types)
#   include   (page) regex that item links must match
#   filter    keywords (default) = relevance filter; none = keep everything
#   query     (gnews, pubmed) query
#   hl / gl   (gnews) Google News language / country edition
#   timeout   (optional) seconds, for slow sites
#   fallback  (optional) false = no Google News fallback if the site is unreachable
#
#   match     (optional) source-specific relevance regex (replaces the global keywords)
#
# Crossref journal feeds are defined in config/journals.yaml.
#
# "page" type: the page is re-read every week; any link not seen the week before
# is new. On its first run the source is "initialised" (nothing reported).
#
# "rss" and "page" sources that block the script (403/404/timeout) automatically
# fall back to Google News for their domain (site:domain), flagged as press.
#
# "gnews" type: press signal (secondary source). The report asks to trace the
# primary source. Useful for agencies without a usable feed.
# ------------------------------------------------------------------

sources:

  # ============================ INTERNATIONAL ============================
  - {id: who, name: "WHO", region: International, tier: 1, type: rss,
     url: "https://www.who.int/rss-feeds/news-english.xml"}
  - {id: ich, name: "ICH", region: International, tier: 1, type: page,
     url: "https://www.ich.org/page/whats-new", include: "ich\\.org/(news|page|meeting)", filter: none}
  - {id: icmra, name: "ICMRA", region: International, tier: 1, type: page,
     url: "https://www.icmra.info/drupal/en/news", include: "icmra\\.info/drupal/(en/)?(news|strategicinitiatives|covid)", filter: none}
  - {id: cioms, name: "CIOMS", region: International, tier: 1, type: page,
     url: "https://cioms.ch/news/", include: "cioms\\.ch/", filter: none}
  - {id: imdrf, name: "IMDRF (devices / SaMD)", region: International, tier: 2, type: page,
     url: "https://www.imdrf.org/documents", include: "imdrf\\.org/(documents|consultations)", timeout: 75}
  - {id: oecd_health, name: "OECD health (press)", region: International, tier: 2, type: gnews,
     query: 'OECD ("health data" OR "real-world" OR "health technology assessment")'}

