  # ============================ PUBLICATIONS ============================
  - {id: pubmed_reg, name: "PubMed — RWE × regulatory/HTA", region: Publications, tier: 1, type: pubmed, filter: none,
     query: '("real-world evidence"[tiab] OR "real-world data"[tiab] OR "real world evidence"[tiab] OR "real world data"[tiab] OR "routinely collected"[tiab] OR "external control"[tiab] OR "synthetic control arm"[tiab]) AND (regulat*[tiab] OR "health technology assessment"[tiab] OR HTA[tiab] OR guidance[tiab] OR "marketing authori*"[tiab] OR approval*[tiab] OR FDA[tiab] OR EMA[tiab] OR payer*[tiab])'}
  - {id: pubmed_methods, name: "PubMed — causal methods / TTE", region: Publications, tier: 1, type: pubmed, filter: none,
     query: '("target trial emulation"[tiab] OR "emulated target trial"[tiab] OR "emulating a target trial"[tiab] OR transportability[tiab] OR "quantitative bias analysis"[tiab] OR "fit-for-purpose"[tiab] OR "data provenance"[tiab] OR "data quality framework"[tiab] OR (estimand*[tiab] AND observational[tiab]) OR "hybrid control"[tiab])'}
  - {id: pubmed_ai_reg, name: "PubMed — AI × regulatory evaluation", region: Publications, tier: 2, type: pubmed, filter: none,
     query: '("artificial intelligence"[tiab] OR "machine learning"[tiab] OR "large language model*"[tiab]) AND ("real-world data"[tiab] OR "real-world evidence"[tiab] OR "regulatory science"[tiab] OR pharmacovigilance[tiab]) AND (regulat*[tiab] OR validation[tiab] OR evaluation[tiab])'}
  - {id: europepmc_preprints, name: "Europe PMC — preprints (medRxiv, SSRN, Research Square…)", region: Publications, tier: 2, type: europepmc,
     query: 'SRC:PPR AND (ABSTRACT:"real-world evidence" OR ABSTRACT:"real-world data" OR ABSTRACT:"real world data" OR ABSTRACT:"target trial" OR ABSTRACT:"external control" OR ABSTRACT:"synthetic control arm" OR ABSTRACT:transportability OR ABSTRACT:"regulatory science" OR ABSTRACT:"health technology assessment")'}
  - {id: europepmc_fulltext, name: "Europe PMC — full-text methods search", region: Publications, tier: 1, type: europepmc,
     query: '("target trial emulation" OR "emulated target trial" OR "quantitative bias analysis" OR "fit-for-purpose" OR "external control arm" OR "hybrid control" OR "data provenance") AND (regulat* OR "health technology assessment" OR guidance OR framework) AND NOT SRC:PPR'}
  - {id: arxiv_methods, name: "arXiv — statistical methodology (stat.ME / stat.AP)", region: Publications, tier: 2, type: arxiv,
     query: '(cat:stat.ME OR cat:stat.AP) AND (abs:"target trial" OR abs:"real-world" OR abs:"real world data" OR abs:"external control" OR abs:transportability OR abs:estimand OR abs:"observational data" OR abs:"electronic health records")'}
