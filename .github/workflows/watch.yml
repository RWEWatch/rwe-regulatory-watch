name: RWE Regulatory Watch

on:
  schedule:
    # Every Wednesday 11:47 UTC = 12:47 Paris (winter) / 13:47 (summer).
    # GitHub may delay scheduled runs by a few minutes to ~1 hour.
    - cron: "47 11 * * 3"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        default: run
        options:
          - run     # full edition: collect, analyse, email, save, publish
          - test    # full edition ignoring memory; no email, nothing saved or published
          - check   # test every source and show the coverage table
          - init    # memorise the current state of news pages (no AI, no email)
          - rerun   # redo this week's edition ignoring memory for dated sources (email + save)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rwe-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Resolve mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode || 'run' }}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "run" ] || [ "$MODE" = "init" ] || [ "$MODE" = "rerun" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi

      - name: Run the watch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          CONTACT_EMAIL: ${{ secrets.SMTP_USER }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          mkdir -p archives data
          export SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          case "$MODE" in
            run)   python -m rwewatch ;;
            test)  python -m rwewatch --no-email --no-save --fresh ;;
            check) python -m rwewatch --check | tee -a "$GITHUB_STEP_SUMMARY" ;;
            init)  python -m rwewatch --init --no-email --no-archive --no-ai ;;
            rerun) python -m rwewatch --fresh ;;
          esac

      - name: Keep the report (download from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwe-watch-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore

      - name: Save memory and archive
        if: success() && steps.mode.outputs.publish == 'true'
        run: |
          git config user.name "rwe-watch-bot"
          git config user.email "rwe-watch-bot@users.noreply.github.com"
          git add -A data archives
          git diff --cached --quiet || git commit -m "Watch of $(date +%F)"
          git push

      - name: Prepare public site
        if: success() && steps.mode.outputs.publish == 'true' && hashFiles('_site/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    needs: watch
    if: needs.watch.outputs.publish == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true   # the watch still works if GitHub Pages is not enabled
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
